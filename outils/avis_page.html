<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avis Bilskirnir</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  /* Servie par outils/avis_page.py. À gauche les avis de la boutique, à droite le formulaire. */
  :root {
    color-scheme: dark;
    --encre: #0b0c0e; --ardoise: #14161a; --ivoire: #ece5d6; --gris-1: #c9c7c2; --gris-3: #8d8b86;
    --or: #d2b06a; --or-fonce: #b08a45; --filet: #ece5d61a; --rouge: #f0a58a; --vert: #9fd3a0;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--encre); color: var(--ivoire); font: 15px/1.5 'Source Sans 3', system-ui, sans-serif; padding: 32px max(16px, (100% - 1180px) / 2) 64px; }
  h1, h2 { font-family: Marcellus, Georgia, serif; font-weight: 400; }
  h1 { font-size: 34px; }
  .chapeau { color: var(--gris-3); margin-top: 4px; }
  .corps { display: grid; gap: 28px; margin-top: 28px; }
  @media (min-width: 900px) { .corps { grid-template-columns: minmax(0, 1fr) 440px; align-items: start; } }

  .barre { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .liste { display: grid; gap: 8px; margin-top: 14px; }
  .carte { display: grid; gap: 4px; width: 100%; padding: 14px 16px; border: 1px solid var(--filet); border-radius: 12px; background: var(--ardoise); color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .carte:hover, .carte[aria-current] { border-color: var(--or); }
  .carte__haut { display: flex; justify-content: space-between; gap: 12px; }
  .carte strong { font-weight: 600; }
  .carte small, .vide { color: var(--gris-3); }
  .carte p { color: var(--gris-1); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .etoiles { color: var(--or); letter-spacing: 2px; white-space: nowrap; }

  form { position: sticky; top: 24px; display: grid; gap: 14px; padding: 22px; border: 1px solid var(--filet); border-radius: 14px; background: var(--ardoise); }
  label, legend { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--gris-1); }
  input[type=text], select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #ece5d626; border-radius: 10px; background: var(--encre); color: var(--ivoire); font: inherit; }
  :is(input, select, textarea):focus { outline: none; border-color: var(--or); }
  textarea { min-height: 150px; resize: vertical; }
  fieldset { border: 0; padding: 0; }
  .notes { display: flex; gap: 6px; }
  .notes label { cursor: pointer; }
  .notes input { position: absolute; opacity: 0; }
  .notes span { display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid #ece5d626; border-radius: 10px; font-size: 16px; color: var(--gris-3); }
  .notes input:checked + span { border-color: var(--or); color: var(--or); background: #d2b06a14; }
  .notes input:focus-visible + span { outline: 2px solid var(--or); }
  .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .case { display: flex; align-items: center; gap: 8px; font-weight: 400; }
  .case input { accent-color: var(--or); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  button.or { padding: 12px 22px; border: 0; border-radius: 999px; background: linear-gradient(180deg, var(--or), var(--or-fonce)); color: #17110a; font: 700 15px 'Source Sans 3', sans-serif; cursor: pointer; }
  button.or:disabled { opacity: .5; cursor: wait; }
  button.lien { padding: 8px 14px; border: 1px solid #ece5d626; border-radius: 999px; background: none; color: var(--gris-1); font: inherit; cursor: pointer; }
  button.lien:hover { border-color: var(--or); color: var(--ivoire); }
  .message { min-height: 1.5em; font-size: 14px; }
  .message.ok { color: var(--vert); }
  .message.erreur { color: var(--rouge); white-space: pre-line; }
  .identifiant { font-size: 12px; color: var(--gris-3); }
</style>
</head>
<body>
  <h1>Avis Bilskirnir</h1>
  <p class="chapeau">Les avis publiés sur la boutique. Clique un avis pour le corriger, ou ajoute-en un nouveau.</p>

  <div class="corps">
    <section>
      <div class="barre">
        <select id="filtre" aria-label="Afficher les avis du livre"><option value="">Tous les livres</option></select>
        <span class="vide" id="compte">Chargement…</span>
      </div>
      <div class="liste" id="liste"></div>
    </section>

    <form id="formulaire" novalidate>
      <div class="actions">
        <h2 id="titre-formulaire">Nouvel avis</h2>
        <button class="lien" type="button" id="nouveau">+ Nouvel avis</button>
      </div>
      <label>Livre<select id="livre" required><option value="">Choisir le livre…</option></select></label>
      <fieldset><legend>Note</legend>
        <div class="notes">
          <label><input type="radio" name="note" value="1"><span>1</span></label>
          <label><input type="radio" name="note" value="2"><span>2</span></label>
          <label><input type="radio" name="note" value="3"><span>3</span></label>
          <label><input type="radio" name="note" value="4"><span>4</span></label>
          <label><input type="radio" name="note" value="5" checked><span>5</span></label>
        </div>
      </fieldset>
      <label>Titre de l'avis<input type="text" id="titre" placeholder="Des héros attachants"></label>
      <label>Texte<textarea id="texte" required placeholder="Le texte du lecteur, tel quel."></textarea></label>
      <div class="deux">
        <label>Auteur<input type="text" id="auteur" placeholder="Pierre G."></label>
        <label>Source<input type="text" id="source" list="sources" placeholder="Amazon"></label>
      </div>
      <datalist id="sources"><option value="Amazon"><option value="Babelio"><option value="Salon"><option value="Site"></datalist>
      <label class="case"><input type="checkbox" id="verifie" checked> Achat vérifié</label>
      <p class="message" id="message" role="status"></p>
      <div class="actions">
        <span class="identifiant" id="identifiant"></span>
        <button class="or" type="submit" id="envoyer">Publier l'avis</button>
      </div>
    </form>
  </div>

<script>
  const JETON = '__JETON__';
  const $ = (id) => document.getElementById(id);
  let livres = [], avis = [], enCours = null; // enCours : le handle de l'avis corrigé, null pour un nouvel avis

  const titreDe = (handle) => (livres.find((l) => l.handle === handle) || {}).titre || handle || 'Sans livre';
  const etoiles = (note) => note ? '★'.repeat(+note) + '☆'.repeat(5 - note) : 'sans note';

  function message(texte, genre) {
    $('message').textContent = texte;
    $('message').className = 'message ' + (genre || '');
  }

  function afficherListe() {
    const filtre = $('filtre').value;
    const visibles = avis.filter((a) => !filtre || a.livre === filtre);
    $('compte').textContent = visibles.length + ' avis';
    $('liste').replaceChildren(...visibles.map((a) => {
      const carte = document.createElement('button');
      carte.type = 'button';
      carte.className = 'carte';
      if (a.handle === enCours) carte.setAttribute('aria-current', 'true');
      carte.innerHTML = '<span class="carte__haut"><strong></strong><span class="etoiles"></span></span><small></small><p></p>';
      carte.querySelector('strong').textContent = a.titre || '(sans titre)';
      carte.querySelector('.etoiles').textContent = etoiles(a.note);
      carte.querySelector('small').textContent = [titreDe(a.livre), a.auteur, a.source].filter(Boolean).join(' · ');
      carte.querySelector('p').textContent = a.texte;
      carte.addEventListener('click', () => ouvrir(a));
      return carte;
    }));
  }

  function ouvrir(a) {
    enCours = a ? a.handle : null;
    $('titre-formulaire').textContent = a ? "Corriger l'avis" : 'Nouvel avis';
    $('envoyer').textContent = a ? 'Enregistrer' : "Publier l'avis";
    $('identifiant').textContent = a ? a.handle : '';
    $('livre').value = a ? a.livre : ($('filtre').value || '');
    document.querySelector(`[name=note][value="${(a && a.note) || 5}"]`).checked = true;
    for (const cle of ['titre', 'texte', 'auteur', 'source']) $(cle).value = a ? a[cle] : '';
    $('verifie').checked = a ? a.verifie === 'oui' : true;
    message('');
    afficherListe();
  }

  async function charger() {
    const reponse = await fetch('/donnees');
    const donnees = await reponse.json();
    if (!reponse.ok) return message(donnees.erreurs.join('\n'), 'erreur');
    livres = donnees.livres;
    avis = donnees.avis;
    for (const select of [$('filtre'), $('livre')]) {
      const premier = select.options[0];
      select.replaceChildren(premier, ...livres.map((l) => new Option(l.titre, l.handle)));
    }
    afficherListe();
  }

  $('filtre').addEventListener('change', afficherListe);
  $('nouveau').addEventListener('click', () => ouvrir(null));

  $('formulaire').addEventListener('submit', async (event) => {
    event.preventDefault();
    const ligne = {
      handle: enCours || '', livre: $('livre').value, note: document.querySelector('[name=note]:checked').value,
      titre: $('titre').value, texte: $('texte').value, auteur: $('auteur').value, source: $('source').value,
      verifie: $('verifie').checked ? 'oui' : 'non',
    };
    $('envoyer').disabled = true;
    message('Envoi à Shopify…');
    try {
      const reponse = await fetch('/avis', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Jeton': JETON }, body: JSON.stringify(ligne) });
      const resultat = await reponse.json();
      if (!reponse.ok || resultat.erreurs.length) return message('Pas envoyé :\n' + resultat.erreurs.join('\n'), 'erreur');
      const nouveau = !enCours;
      ligne.handle = resultat.handle;
      avis = avis.filter((a) => a.handle !== ligne.handle).concat(ligne);
      ouvrir(nouveau ? null : ligne);
      message(nouveau ? 'Avis publié sur la boutique.' : 'Avis corrigé sur la boutique.', 'ok');
    } catch {
      message("La page ne répond plus : la fenêtre noire a peut-être été fermée. Relance « Avis Bilskirnir ».", 'erreur');
    } finally {
      $('envoyer').disabled = false;
    }
  });

  charger();
</script>
</body>
</html>
